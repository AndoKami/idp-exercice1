<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Firebase Auth Demo</title>
  <!-- Inclure les modules Firebase via le CDN -->
  <script type="module">
    // Importer les modules nécessaires de Firebase
    import { initializeApp } from 'https://www.gstatic.com/firebasejs/9.12.1/firebase-app.js';
    import { getAuth, signInWithEmailAndPassword } from 'https://www.gstatic.com/firebasejs/9.12.1/firebase-auth.js';

    // Configuration Firebase
    const firebaseConfig = {
        apiKey: "AIzaSyDgObKNfnEeBVZZQZLYAmPQ3GjXJHYYAJc",
    authDomain: "idp-exrcise.firebaseapp.com",
    projectId: "idp-exrcise",
    };

    // Initialiser l'application Firebase
    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    // Gestion de la soumission du formulaire
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;

      try {
        const userCredential = await signInWithEmailAndPassword(auth, email, password);
        const token = await userCredential.user.getIdToken();
        console.log('Token:', token); // Affiche le token
        alert('Connexion réussie ! Token affiché dans la console.');
      } catch (error) {
        alert('Erreur lors de la connexion : ' + error.message);
      }
    });
  </script>
</head>
<body>
  <h1>Login</h1>
  <form id="loginForm">
    <input type="email" id="email" placeholder="Email" required />
    <input type="password" id="password" placeholder="Password" required />
    <button type="submit">Login</button>
  </form>
</body>
</html>
